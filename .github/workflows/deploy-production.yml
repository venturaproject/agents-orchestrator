name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serv00-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend

      - name: Lint and type-check
        run: make lint

      - name: Run tests
        run: make test

      - name: Build production app
        run: make build

      - name: Build NestJS backend
        run: make build-backend

  deploy:
    name: Deploy to Serv00
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.SERV00_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERV00_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "Missing SERV00_SSH_PRIVATE_KEY secret" >&2; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing SERV00_KNOWN_HOSTS secret" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null "$RUNNER_TEMP/serv00_deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/serv00_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy frontend and backend
        env:
          SERV00_SSH_TARGET: prostiner@s16.serv00.com
          SERV00_SSH_KEY_FILE: ${{ runner.temp }}/serv00_deploy
          NEXT_PUBLIC_BACKEND_URL: https://api.demo.prostiner.serv00.net
        run: make deploy
