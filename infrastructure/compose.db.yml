services:
  postgres:
    image: postgres:16-alpine
    container_name: crew-postgres-local
    restart: "no"
    environment:
      POSTGRES_USER: ${LOCAL_PG_USER:-crew_local}
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:?Set LOCAL_PG_PASSWORD in .env.local}
      POSTGRES_DB: ${LOCAL_PG_DATABASE:-crew_local}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - crew-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_PG_USER:-crew_local} -d ${LOCAL_PG_DATABASE:-crew_local}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  crew-postgres-data:
    external: true
    name: speed-paradigm_crew-postgres-data

networks:
  default:
    name: crew-db-local
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.241.0/24
